<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Visages">
<meta name="theme-color" content="#8C6410">
<title>Visages</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --accent:#E8AC1E; --accent-deep:#8C6410; --accent-light:#FBF0D6; --warm:#F6F4EF; --warm-dark:#E4DFD3;
  --text:#25241F; --text-light:#8B8579; --red:#AD5A45; --red-light:#F2E4DE;
  --correct:#8C6410; --wrong:#AD5A45;
  --r-sm:10px; --r-md:14px; --r-lg:20px;
  --font-d:'Fredoka',-apple-system,sans-serif;
  --font-b:'Nunito Sans',-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font-b);background:var(--warm);color:var(--text);min-height:100vh;min-height:-webkit-fill-available}
#app{max-width:420px;margin:0 auto;padding:0 20px 60px}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;padding:24px 0 18px;border-bottom:1px solid var(--warm-dark);margin-bottom:24px}
header h1{font-family:var(--font-d);font-size:26px;font-weight:600;color:var(--accent-deep);letter-spacing:-0.01em;cursor:pointer}
.header-right{display:flex;align-items:center;gap:10px}
.lang-btn{padding:5px 10px;border-radius:var(--r-sm);border:1.5px solid var(--warm-dark);font-size:11px;font-weight:700;font-family:var(--font-b);cursor:pointer;background:#fff;color:var(--text-light);transition:all .2s;letter-spacing:.03em}
.lang-btn:active{transform:scale(.95)}
.nav{display:flex;gap:6px}
.nav button{padding:8px 18px;border-radius:24px;border:1.5px solid transparent;font-size:13px;font-weight:600;font-family:var(--font-b);cursor:pointer;background:transparent;color:var(--text-light);transition:all .25s}
.nav button.active{background:var(--accent);color:#000;border-color:var(--accent)}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 24px;border-radius:var(--r-sm);border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font-b);transition:all .2s}
.btn-p{background:var(--accent);color:#000}
.btn-p:disabled{background:var(--warm-dark);color:var(--text-light);cursor:default}
.btn-p:not(:disabled):active{transform:scale(.97)}
.btn-s{background:var(--accent-light);color:var(--accent-deep)}
.btn-s:active{transform:scale(.97)}
.btn-d{display:inline-flex;align-items:center;justify-content:center;padding:8px 11px;border-radius:var(--r-sm);border:1.5px solid var(--red-light);cursor:pointer;background:var(--red-light);color:var(--red);font-family:var(--font-b)}
.btn-icon{display:inline-flex;align-items:center;justify-content:center;padding:8px 11px;border-radius:var(--r-sm);border:1.5px solid var(--accent-light);cursor:pointer;background:var(--accent-light);color:var(--accent-deep)}
.btn-icon:active,.btn-d:active{transform:scale(.95)}

/* Inputs */
.inp{padding:13px 16px;border-radius:var(--r-sm);border:1.5px solid var(--warm-dark);font-size:15px;font-family:var(--font-b);width:100%;outline:none;background:#fff;transition:border-color .2s}
.inp:focus{border-color:var(--accent-deep)}

/* Utility */
.mb{margin-bottom:10px}.mt{margin-top:18px}
.hidden{display:none !important}

/* Folders view */
.folder-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-md);background:#fff;border:1px solid var(--warm-dark);cursor:pointer;transition:all .15s;animation:fadeUp .3s ease both}
.folder-item:active{transform:scale(.98)}
.folder-icon{width:38px;height:38px;border-radius:var(--r-sm);background:var(--accent-light);color:var(--accent-deep);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.folder-info{flex:1;min-width:0}
.folder-name{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder-count{font-size:12px;color:var(--text-light);margin-top:2px}
.folder-actions{display:flex;gap:4px;flex-shrink:0}
.folder-list{display:flex;flex-direction:column;gap:8px}

.section-lbl{font-size:12px;color:var(--text-light);font-weight:600;margin-bottom:14px;text-transform:uppercase;letter-spacing:.06em}

.add-box{padding:20px;border-radius:var(--r-lg);background:#fff;border:1.5px dashed var(--warm-dark);margin-bottom:24px}
.add-box .lbl{font-size:13px;font-weight:600;color:var(--text-light);margin-bottom:14px;text-transform:uppercase;letter-spacing:.06em}

.preview{width:100%;max-height:220px;object-fit:cover;border-radius:var(--r-sm);margin-bottom:12px;display:none}
.preview.on{display:block}

/* Card list */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r-md);background:#fff;border:1px solid var(--warm-dark);animation:fadeUp .3s ease both}
.thumb{width:52px;height:52px;border-radius:var(--r-sm);object-fit:cover;flex-shrink:0}
.info{flex:1;min-width:0}
.name{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.surname{font-size:12px;color:var(--text-light);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em}
.stats{font-size:11px;color:var(--text-light);margin-top:3px}
.actions{display:flex;gap:4px;flex-shrink:0}
.edit-row{display:flex;gap:6px}
.edit-row input{flex:1;padding:7px 10px;font-size:14px}
.edit-row button{padding:7px 14px;border-radius:10px;border:none;background:var(--accent);color:#000;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font-b)}

.empty{text-align:center;padding:50px 20px;color:var(--text-light);font-size:14px;line-height:1.7}
.empty .empty-icon{width:56px;height:56px;border-radius:50%;background:var(--accent-light);color:var(--accent-deep);display:flex;align-items:center;justify-content:center;margin:0 auto 14px}

/* Back button */
.back-btn{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--text-light);cursor:pointer;background:none;border:none;font-family:var(--font-b);padding:0;margin-bottom:16px}
.back-btn:active{opacity:.6}

/* Quiz */
.qbar{display:flex;justify-content:space-between;font-size:13px;color:var(--text-light);font-weight:600;margin-bottom:14px}
.track{height:4px;border-radius:3px;background:var(--warm-dark);margin-bottom:22px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:3px;transition:width .5s ease}
.q-photo-wrap{border-radius:var(--r-lg);overflow:hidden;border:1.5px solid var(--warm-dark);margin-bottom:18px;background:#fff;position:relative;cursor:pointer;-webkit-user-select:none;user-select:none}
.q-photo{width:100%;max-height:340px;object-fit:cover;display:block}
.tap-hint{position:absolute;bottom:0;left:0;right:0;padding:12px;text-align:center;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.45));pointer-events:none;transition:opacity .3s}
.tap-hint.hide{opacity:0}
.tap-prompt{font-size:15px;color:var(--text-light);font-weight:600;margin-bottom:4px}
.judge-btns{display:flex;gap:10px;margin-top:8px}
.judge-yes{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--accent-light);color:var(--correct);border-radius:var(--r-sm);padding:14px;font-size:15px;font-weight:700;border:none;cursor:pointer;font-family:var(--font-b);transition:transform .15s}
.judge-no{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--red-light);color:var(--wrong);border-radius:var(--r-sm);padding:14px;font-size:15px;font-weight:700;border:none;cursor:pointer;font-family:var(--font-b);transition:transform .15s}
.judge-yes:active,.judge-no:active{transform:scale(.96)}

.res{text-align:center;animation:fadeUp .25s ease}
.badge{display:inline-block;padding:4px 14px;border-radius:var(--r-sm);font-size:13px;font-weight:700;margin-bottom:10px}
.badge-ok{background:var(--accent-light);color:var(--correct)}
.badge-ko{background:var(--red-light);color:var(--wrong)}
.ans{font-family:var(--font-d);font-weight:600;font-size:24px;margin-bottom:4px}
.ans-surname{font-size:16px;color:var(--text-light);margin-bottom:18px;text-transform:uppercase;letter-spacing:.04em}

.fin{text-align:center;padding:36px 0;animation:fadeUp .4s ease}
.fin-n{font-family:var(--font-d);font-weight:600;font-size:34px;margin-bottom:24px}
.fin-b{display:flex;gap:8px;flex-direction:column}

.setup-box{padding:20px;border-radius:var(--r-lg);background:#fff;border:1px solid var(--warm-dark)}
.setup-box .lbl{margin-bottom:16px}
.setup-options{display:flex;flex-wrap:wrap;gap:8px}
.setup-opt{padding:12px 0;border-radius:var(--r-sm);border:1.5px solid var(--warm-dark);font-size:15px;font-weight:600;font-family:var(--font-b);cursor:pointer;background:#fff;color:var(--text);transition:all .2s;flex:1;min-width:70px;text-align:center}
.setup-opt:active{transform:scale(.96)}
.setup-opt:hover{border-color:var(--accent-deep);color:var(--accent-deep)}

/* IO bar */
.io-bar{margin-top:28px;padding-top:20px;border-top:1px solid var(--warm-dark);display:flex;gap:8px}
.io-bar .btn{font-size:13px;padding:11px 16px}

/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 20px;border-radius:var(--r-sm);font-size:13px;font-weight:600;z-index:200;animation:toastIn .3s ease,toastOut .3s ease 2s forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}

/* Confirm */
.confirm-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(37,36,31,.35);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.confirm-box{background:#fff;border-radius:var(--r-lg);padding:24px;max-width:300px;width:90%;text-align:center;box-shadow:0 8px 28px rgba(37,36,31,.14)}
.confirm-box p{font-size:15px;margin-bottom:18px;line-height:1.5}
.confirm-btns{display:flex;gap:8px}
.confirm-btns button{flex:1}

/* Small phones */
@media (max-width:360px){
  #app{padding:0 14px 60px}
  header{padding:18px 0 14px;margin-bottom:18px}
  header h1{font-size:22px}
  .header-right{gap:6px}
  .lang-btn{padding:4px 7px;font-size:10px}
  .nav{gap:4px}
  .nav button{padding:7px 12px;font-size:12px}
  .judge-yes,.judge-no{padding:14px 8px;font-size:14px}
}

/* Crop tool */
.crop-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(37,36,31,.55);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .15s ease}
.crop-box{background:#fff;border-radius:var(--r-lg);padding:20px;max-width:400px;width:100%;box-shadow:0 8px 28px rgba(37,36,31,.2)}
.crop-stage{position:relative;margin:0 auto;background:#111;border-radius:var(--r-sm);overflow:hidden;touch-action:none}
.crop-stage img{display:block;pointer-events:none;user-select:none;-webkit-user-select:none}
.crop-sel{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);cursor:move;touch-action:none}
.crop-handle{position:absolute;width:20px;height:20px;background:#fff;border:2px solid var(--accent-deep);border-radius:50%;touch-action:none}
.crop-handle[data-h="nw"]{left:-11px;top:-11px;cursor:nwse-resize}
.crop-handle[data-h="ne"]{right:-11px;top:-11px;cursor:nesw-resize}
.crop-handle[data-h="sw"]{left:-11px;bottom:-11px;cursor:nesw-resize}
.crop-handle[data-h="se"]{right:-11px;bottom:-11px;cursor:nwse-resize}
.crop-btns{display:flex;gap:8px;margin-top:16px}
.crop-btns button{flex:1}
.thumb-btn{cursor:pointer;position:relative}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 onclick="goHome()">Visages</h1>
    <div class="header-right">
      <button class="lang-btn" id="langBtn" onclick="toggleLang()">EN</button>
      <div class="nav" id="navBar">
        <button id="navDeck" class="active" onclick="showDeck()" data-i18n="nav_cards">Cartes</button>
        <button id="navQuiz" onclick="startQuiz()" data-i18n="nav_quiz">Quiz</button>
      </div>
    </div>
  </header>

  <!-- ===== FOLDERS VIEW ===== -->
  <div id="foldersView">
    <div class="add-box">
      <div class="lbl" data-i18n="new_class">Nouvelle classe</div>
      <input type="text" id="folderInput" class="inp mb" data-i18n-placeholder="class_placeholder" placeholder="Ex : L1 Maths 2026" onkeydown="if(event.key==='Enter')addFolder()">
      <button class="btn btn-p" id="addFolderBtn" onclick="addFolder()" disabled data-i18n="create">Créer</button>
    </div>
    <div class="section-lbl" id="foldersCount"></div>
    <div class="folder-list" id="folderList"></div>
    <div class="empty hidden" id="foldersEmpty"><span class="empty-icon"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a1 1 0 0 1 1-1h5l2 2h9a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V7Z"/></svg></span><span data-i18n="empty_folders">Crée une classe pour commencer<br>à ajouter des visages.</span></div>
    <div class="io-bar hidden" id="ioBarGlobal">
      <button class="btn btn-s" onclick="document.getElementById('importGlobalInput').click()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg><span data-i18n="import_class">Importer une classe (.json)</span></button>
      <input type="file" id="importGlobalInput" accept=".json" onchange="importFolder(event)" style="display:none">
    </div>
  </div>

  <!-- ===== DECK VIEW ===== -->
  <div id="deckView" class="hidden">
    <button class="back-btn" onclick="goHome()" data-i18n="back_classes">← Classes</button>
    <div class="add-box">
      <div class="lbl" data-i18n="add_person">Ajouter une personne</div>
      <img id="preview" class="preview" alt="aperçu">
      <input type="file" id="fileInput" accept="image/*" onchange="onPhoto(event)" style="display:none">
      <button class="btn btn-s mb" onclick="document.getElementById('fileInput').click()">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.4"/></svg>
        <span id="photoLbl" data-i18n="choose_photo">Choisir une photo</span>
      </button>
      <button class="btn btn-s mb hidden" id="cropTriggerBtn" onclick="cropPending()">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>
        <span data-i18n="crop_photo">Rogner la photo</span>
      </button>
      <input type="text" id="firstNameInput" class="inp mb" data-i18n-placeholder="first_name" placeholder="Prénom" oninput="updAdd()" onkeydown="if(event.key==='Enter')document.getElementById('lastNameInput').focus()">
      <input type="text" id="lastNameInput" class="inp mb" data-i18n-placeholder="last_name" placeholder="NOM (facultatif)" oninput="updAdd()" onkeydown="if(event.key==='Enter')addCard()" style="text-transform:uppercase">
      <button class="btn btn-p" id="addBtn" onclick="addCard()" disabled data-i18n="add">Ajouter</button>
    </div>
    <div class="section-lbl hidden" id="countLbl"></div>
    <div class="list" id="cardList"></div>
    <div class="empty hidden" id="emptyMsg"><span class="empty-icon"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.4" r="3.6"/><path d="M5 20c0-3.6 3.1-6.4 7-6.4s7 2.8 7 6.4"/></svg></span><span data-i18n="empty_cards">Ajoute des visages<br>pour les réviser.</span></div>
    <div class="io-bar hidden" id="ioBar">
      <button class="btn btn-s" onclick="exportFolder()"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M7.5 8.5 12 4l4.5 4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg><span data-i18n="export">Exporter</span></button>
      <button class="btn btn-s" onclick="document.getElementById('importInput').click()"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg><span data-i18n="import">Importer</span></button>
      <input type="file" id="importInput" accept=".json" onchange="importCards(event)" style="display:none">
    </div>
  </div>

  <!-- ===== QUIZ VIEW ===== -->
  <div id="quizView" class="hidden">
    <!-- Setup screen -->
    <div id="quizSetup">
      <button class="back-btn" onclick="showDeck()" data-i18n="back_cards">← Cartes</button>
      <div class="setup-box">
        <div class="lbl" data-i18n="pick_count">Nombre d'élèves à piocher</div>
        <div class="setup-options" id="setupOptions"></div>
        <button class="btn btn-p mt" id="allBtn" onclick="launchQuiz(0)" data-i18n="all_class">Toute la classe</button>
      </div>
    </div>
    <!-- Active quiz -->
    <div id="quizActive" class="hidden">
      <button class="back-btn" onclick="showSetup()" data-i18n="back_return">← Retour</button>
      <div class="qbar"><span id="qProg"></span><span id="qScore"></span></div>
      <div class="track"><div class="fill" id="qFill"></div></div>
      <div class="q-photo-wrap" id="qPhotoWrap" onclick="revealName()">
        <img id="qPhoto" class="q-photo" alt="Qui est-ce ?">
        <div class="tap-hint" id="tapHint" data-i18n="tap_reveal">Clique pour révéler</div>
      </div>
      <div id="guessUI" class="res">
        <div class="tap-prompt" data-i18n="who_is">Qui est-ce ?</div>
      </div>
      <div id="resUI" class="res hidden">
        <div class="ans" id="ansName"></div>
        <div class="ans-surname" id="ansSurname"></div>
        <div class="judge-btns">
          <button class="btn judge-no" onclick="judgeCard(false)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg><span data-i18n="didnt_know">Je ne savais pas</span></button>
          <button class="btn judge-yes" onclick="judgeCard(true)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg><span data-i18n="knew_it">Je savais</span></button>
        </div>
      </div>
    </div>
    <!-- Final score -->
    <div id="quizFin" class="fin hidden">
      <div class="fin-n" id="finN"></div>
      <div class="fin-b">
        <button class="btn btn-p" onclick="showSetup()" data-i18n="new_quiz">Nouveau quiz</button>
        <button class="btn btn-s" onclick="showDeck()" data-i18n="back_to_cards">← Retour aux cartes</button>
      </div>
    </div>
  </div>
</div>

<div id="confirmOverlay" class="hidden"></div>
<div id="cropOverlay" class="hidden"></div>

<script>
// ================ IndexedDB ================
const DB="visages_db2", VER=1, S_FOLDERS="folders", S_CARDS="cards";
let db=null;

function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB,VER);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains(S_FOLDERS)) d.createObjectStore(S_FOLDERS,{keyPath:"id"});
      if(!d.objectStoreNames.contains(S_CARDS)){
        const s=d.createObjectStore(S_CARDS,{keyPath:"id"});
        s.createIndex("folderId","folderId",{unique:false});
      }
    };
    r.onsuccess=e=>{db=e.target.result;res(db)};
    r.onerror=e=>rej(e);
  });
}
function dbAll(store){return new Promise((res,rej)=>{const r=db.transaction(store,"readonly").objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=e=>rej(e)})}
function dbPut(store,obj){return new Promise((res,rej)=>{const r=db.transaction(store,"readwrite").objectStore(store).put(obj);r.onsuccess=()=>res();r.onerror=e=>rej(e)})}
function dbDel(store,id){return new Promise((res,rej)=>{const r=db.transaction(store,"readwrite").objectStore(store).delete(id);r.onsuccess=()=>res();r.onerror=e=>rej(e)})}
function dbByIndex(store,idx,val){return new Promise((res,rej)=>{const r=db.transaction(store,"readonly").objectStore(store).index(idx).getAll(val);r.onsuccess=()=>res(r.result||[]);r.onerror=e=>rej(e)})}

function onPhoto(e){
  const file=e.target.files&&e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const max=640;let w=img.width,h=img.height;
      if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      pendingPhoto=c.toDataURL("image/jpeg",.75);
      const prev=document.getElementById("preview");
      prev.src=pendingPhoto;prev.classList.add("on");
      document.getElementById("photoLbl").textContent=t("change_photo");
      updAdd();
    };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

  document.getElementById("addBtn").disabled=!(document.getElementById("firstNameInput").value.trim()&&pendingPhoto);
  document.getElementById("cropTriggerBtn").classList.toggle("hidden",!pendingPhoto);

// ================ Crop tool ================
let cropState=null;
function openCropper(dataUrl,onDone){
  const img=new Image();
  img.onload=()=>{
    const maxW=Math.min(360,window.innerWidth-64);
    const maxH=Math.min(420,window.innerHeight-220);
    const fit=Math.min(maxW/img.naturalWidth,maxH/img.naturalHeight,1);
    const dispW=Math.round(img.naturalWidth*fit),dispH=Math.round(img.naturalHeight*fit);
    cropState={src:dataUrl,natW:img.naturalWidth,natH:img.naturalHeight,dispW,dispH,onDone,
      sel:{x:0,y:0,w:dispW,h:dispH},drag:null};
    renderCropper();
  };
  img.src=dataUrl;
}
function renderCropper(){
  const o=document.getElementById("cropOverlay");
  o.className="crop-overlay";
  o.innerHTML=`<div class="crop-box">
    <div class="crop-stage" id="cropStage" style="width:${cropState.dispW}px;height:${cropState.dispH}px">
      <img src="${cropState.src}" width="${cropState.dispW}" height="${cropState.dispH}" alt="">
      <div class="crop-sel" id="cropSel">
        <div class="crop-handle" data-h="nw"></div>
        <div class="crop-handle" data-h="ne"></div>
        <div class="crop-handle" data-h="sw"></div>
        <div class="crop-handle" data-h="se"></div>
      </div>
    </div>
    <div class="crop-btns">
      <button class="btn btn-s" onclick="closeCropper()">${t("cancel")}<\/button>
      <button class="btn btn-p" onclick="confirmCrop()">${t("crop_apply")}<\/button>
    </div>
  </div>`;
  layoutCropSel();
  const sel=document.getElementById("cropSel");
  sel.addEventListener("pointerdown",e=>startCropDrag(e,"move"));
  sel.querySelectorAll(".crop-handle").forEach(h=>{
    h.addEventListener("pointerdown",e=>{e.stopPropagation();startCropDrag(e,h.dataset.h)});
  });
}
function layoutCropSel(){
  const sel=document.getElementById("cropSel");
  if(!sel||!cropState) return;
  const s=cropState.sel;
  sel.style.left=s.x+"px";sel.style.top=s.y+"px";sel.style.width=s.w+"px";sel.style.height=s.h+"px";
}
function startCropDrag(e,mode){
  e.preventDefault();
  const startX=e.clientX,startY=e.clientY;
  const startSel={...cropState.sel};
  const MIN=32,W=cropState.dispW,H=cropState.dispH;
  function onMove(ev){
    const dx=ev.clientX-startX,dy=ev.clientY-startY;
    let {x,y,w,h}=startSel;
    if(mode==="move"){
      x=Math.min(Math.max(0,startSel.x+dx),W-w);
      y=Math.min(Math.max(0,startSel.y+dy),H-h);
    }else{
      let x2=startSel.x+startSel.w,y2=startSel.y+startSel.h;
      if(mode.includes("w")){x=Math.min(Math.max(0,startSel.x+dx),x2-MIN);}
      if(mode.includes("e")){x2=Math.max(Math.min(W,x2+dx),startSel.x+MIN);}
      if(mode.includes("n")){y=Math.min(Math.max(0,startSel.y+dy),y2-MIN);}
      if(mode.includes("s")){y2=Math.max(Math.min(H,y2+dy),startSel.y+MIN);}
      w=x2-x;h=y2-y;
    }
    cropState.sel={x,y,w,h};
    layoutCropSel();
  }
  function onUp(){
    document.removeEventListener("pointermove",onMove);
    document.removeEventListener("pointerup",onUp);
  }
  document.addEventListener("pointermove",onMove);
  document.addEventListener("pointerup",onUp);
}
function closeCropper(){
  document.getElementById("cropOverlay").className="hidden";
  cropState=null;
}
function confirmCrop(){
  if(!cropState) return;
  const{sel,natW,natH,dispW,dispH,src,onDone}=cropState;
  const scaleX=natW/dispW,scaleY=natH/dispH;
  const sx=sel.x*scaleX,sy=sel.y*scaleY,sw=sel.w*scaleX,sh=sel.h*scaleY;
  const img=new Image();
  img.onload=()=>{
    const max=640;let outW=sw,outH=sh;
    if(outW>max||outH>max){if(outW>outH){outH=Math.round(outH*max/outW);outW=max}else{outW=Math.round(outW*max/outH);outH=max}}
    const c=document.createElement("canvas");c.width=Math.round(outW);c.height=Math.round(outH);
    c.getContext("2d").drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
    const outData=c.toDataURL("image/jpeg",.82);
    closeCropper();
    onDone(outData);
  };
  img.src=src;
}

  document.getElementById("quizSetup").classList.remove("hidden");
  document.getElementById("quizActive").classList.add("hidden");
  document.getElementById("quizFin").classList.add("hidden");
  // Generate number options based on class size
  const n=cards.length;
  const opts=document.getElementById("setupOptions");
  const choices=[];
  if(n>=5) choices.push(5);
  if(n>=10) choices.push(10);
  if(n>=15) choices.push(15);
  if(n>=20) choices.push(20);
  // Always add some smaller options if class is small
  if(!choices.length){for(let i=2;i<=n;i++) choices.push(i)}
  opts.innerHTML=choices.map(c=>`<button class="setup-opt" onclick="launchQuiz(${c})">${c}<\/button>`).join("");
  document.getElementById("allBtn").textContent=t("all_class")+" ("+n+")";
}

function launchQuiz(count){
  const total=count||cards.length;
  const w=cards.flatMap(c=>Array(Math.max(1,4-c.score)).fill(c));
  const s=shuffle(w),seen=new Set();
  quizCards=s.filter(c=>{if(seen.has(c.id))return false;seen.add(c.id);return true}).slice(0,total);
  quizIdx=0;flipped=false;score={ok:0,total:0};
  document.getElementById("quizSetup").classList.add("hidden");
  showQCard();
}

function showQCard(){
  document.getElementById("quizActive").classList.remove("hidden");
  document.getElementById("quizFin").classList.add("hidden");
  const c=quizCards[quizIdx];
  document.getElementById("qProg").textContent=(quizIdx+1)+" / "+quizCards.length;
  document.getElementById("qScore").textContent="✓ "+score.ok+" / "+score.total;
  document.getElementById("qFill").style.width=((quizIdx/quizCards.length)*100)+"%";
  document.getElementById("qPhoto").src=c.photo;
  document.getElementById("guessUI").classList.remove("hidden");
  document.getElementById("resUI").classList.add("hidden");
  document.getElementById("tapHint").classList.remove("hide");
  flipped=false;
}

function revealName(){
  if(flipped) return;
  flipped=true;
  const c=quizCards[quizIdx];
  document.getElementById("tapHint").classList.add("hide");
  document.getElementById("guessUI").classList.add("hidden");
  document.getElementById("resUI").classList.remove("hidden");
  document.getElementById("ansName").textContent=c.firstName||c.name;
  const sEl=document.getElementById("ansSurname");
  sEl.textContent=c.lastName||"";
  sEl.style.display=c.lastName?"block":"none";
}

async function judgeCard(knew){
  const c=quizCards[quizIdx];
  score.total++;
  if(knew) score.ok++;
  const card=cards.find(x=>x.id===c.id);
  if(card){card.attempts++;card.score=knew?card.score+1:Math.max(0,card.score-1);await dbPut(S_CARDS,card)}
  document.getElementById("qScore").textContent="✓ "+score.ok+" / "+score.total;
  document.getElementById("qFill").style.width=(((quizIdx+1)/quizCards.length)*100)+"%";
  if(quizIdx+1>=quizCards.length){showFin();return}
  quizIdx++;showQCard();
}

function showFin(){
  document.getElementById("quizActive").classList.add("hidden");
  document.getElementById("quizFin").classList.remove("hidden");
  document.getElementById("finN").textContent=score.ok+" / "+score.total;
}

// ================ Export / Import ================
function exportFolder(){
  if(!currentFolder||!cards.length) return;
  const data={folder:{id:currentFolder.id,name:currentFolder.name},cards:cards};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const safeName=currentFolder.name.replace(/[^a-zA-Z0-9àâäéèêëïîôùûüÿçæœ _-]/g,"").replace(/ /g,"_");
  a.href=url;a.download="visages_"+safeName+".json";a.click();
  URL.revokeObjectURL(url);
  showToast(t("export_done"));
}

async function importCards(e){
  const file=e.target.files&&e.target.files[0];
  if(!file||!currentFolder) return;
  try{
    const text=await file.text();
    const data=JSON.parse(text);
    // Support both old format (array) and new format ({folder, cards})
    const arr=Array.isArray(data)?data:(data.cards||[]);
    let count=0;
    for(const c of arr){
      if(!c.id||!c.name||!c.photo) continue;
      if(cards.find(x=>x.id===c.id)) continue;
      const card={id:c.id,folderId:currentFolder.id,name:c.name,firstName:c.firstName||c.name,lastName:c.lastName||"",photo:c.photo,score:c.score||0,attempts:c.attempts||0};
      cards.push(card);await dbPut(S_CARDS,card);count++;
    }
    renderDeck();
    showToast(t("import_done")(count));
  }catch(err){showToast(t("invalid_file"))}
  e.target.value="";
}

async function importFolder(e){
  const file=e.target.files&&e.target.files[0];
  if(!file) return;
  try{
    const text=await file.text();
    const data=JSON.parse(text);
    if(!data.folder||!data.cards) throw new Error("Format invalide");
    // Create folder with new id to avoid conflicts
    const newId=Date.now().toString();
    const folder={id:newId,name:data.folder.name,created:Date.now()};
    folders.push(folder);await dbPut(S_FOLDERS,folder);
    let count=0;
    for(const c of data.cards){
      if(!c.name||!c.photo) continue;
      const card={id:(Date.now()+count).toString(),folderId:newId,name:c.name,firstName:c.firstName||c.name,lastName:c.lastName||"",photo:c.photo,score:0,attempts:0};
      await dbPut(S_CARDS,card);count++;
    }
    renderFolders();
    showToast(t("import_folder_done")(data.folder.name,count));
  }catch(err){showToast(t("invalid_file"))}
  e.target.value="";
}

// Hide nav on home
document.getElementById("navBar").classList.add("hidden");

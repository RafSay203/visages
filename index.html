<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Visages">
<meta name="theme-color" content="#1A1915">
<title>Visages</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme:dark;
  --accent:#E8AC1E; --accent-deep:#F2C64F; --accent-light:#3A2E12; --warm:#1A1915; --warm-dark:#3A362D;
  --surface:#26241E; --surface-2:#302D26;
  --text:#F4F1E8; --text-light:#A49C8A; --red:#E5907A; --red-light:#3E2620;
  --correct:#F2C64F; --wrong:#E5907A;
  --r-sm:10px; --r-md:14px; --r-lg:20px;
  --font-d:'Fredoka',-apple-system,sans-serif;
  --font-b:'Nunito Sans',-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font-b);background:var(--warm);color:var(--text);min-height:100vh;min-height:-webkit-fill-available}
#app{max-width:420px;margin:0 auto;padding:0 20px 60px}

/* Header */
header{display:flex;align-items:center;justify-content:space-between;padding:24px 0 18px;border-bottom:1px solid var(--warm-dark);margin-bottom:24px}
header h1{font-family:var(--font-d);font-size:26px;font-weight:600;color:var(--accent-deep);letter-spacing:-0.01em;cursor:pointer}
.header-right{display:flex;align-items:center;gap:10px}
.lang-btn{padding:5px 10px;border-radius:var(--r-sm);border:1.5px solid var(--warm-dark);font-size:11px;font-weight:700;font-family:var(--font-b);cursor:pointer;background:var(--surface);color:var(--text-light);transition:all .2s;letter-spacing:.03em}
.lang-btn:active{transform:scale(.95)}
.nav{display:flex;gap:6px}
.nav button{padding:8px 18px;border-radius:24px;border:1.5px solid transparent;font-size:13px;font-weight:600;font-family:var(--font-b);cursor:pointer;background:transparent;color:var(--text-light);transition:all .25s}
.nav button.active{background:var(--accent);color:#000;border-color:var(--accent)}

/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 24px;border-radius:var(--r-sm);border:none;font-size:15px;font-weight:600;cursor:pointer;font-family:var(--font-b);transition:all .2s}
.btn-p{background:var(--accent);color:#000}
.btn-p:disabled{background:var(--warm-dark);color:var(--text-light);cursor:default}
.btn-p:not(:disabled):active{transform:scale(.97)}
.btn-s{background:var(--accent-light);color:var(--accent-deep)}
.btn-s:active{transform:scale(.97)}
.btn-d{display:inline-flex;align-items:center;justify-content:center;padding:5px 6px;border-radius:var(--r-sm);border:1.5px solid var(--red-light);cursor:pointer;background:var(--red-light);color:var(--red);font-family:var(--font-b)}
.btn-icon{display:inline-flex;align-items:center;justify-content:center;padding:5px 6px;border-radius:var(--r-sm);border:1.5px solid var(--accent-light);cursor:pointer;background:var(--accent-light);color:var(--accent-deep)}
.btn-icon:active,.btn-d:active{transform:scale(.95)}

/* Inputs */
.inp{padding:13px 16px;border-radius:var(--r-sm);border:1.5px solid var(--warm-dark);font-size:15px;font-family:var(--font-b);width:100%;outline:none;background:var(--surface-2);color:var(--text);transition:border-color .2s}
.inp::placeholder{color:var(--text-light);opacity:1}
.inp:focus{border-color:var(--accent-deep)}

/* Utility */
.mb{margin-bottom:10px}.mt{margin-top:18px}
.hidden{display:none !important}

/* Folders view */
.folder-item{display:flex;align-items:center;gap:10px;padding:14px 12px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--warm-dark);cursor:pointer;transition:all .15s;animation:fadeUp .3s ease both}
.folder-item:active{transform:scale(.98)}
.folder-info{flex:1;min-width:0}
.folder-name{font-size:16px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.folder-count{font-size:12px;color:var(--text-light);margin-top:2px}
.folder-actions{display:flex;gap:4px;flex-shrink:0}
.folder-list{display:flex;flex-direction:column;gap:8px}

.section-lbl{font-size:12px;color:var(--text-light);font-weight:600;margin-bottom:14px;text-transform:uppercase;letter-spacing:.06em}

.add-box{padding:20px;border-radius:var(--r-lg);background:var(--surface);border:1.5px dashed var(--warm-dark);margin-bottom:24px}
.add-box .lbl{font-size:13px;font-weight:600;color:var(--text-light);margin-bottom:14px;text-transform:uppercase;letter-spacing:.06em}

.preview{width:min(100%,176px);aspect-ratio:4/5;object-fit:cover;border-radius:var(--r-sm);margin:0 auto 12px;display:none}
.preview.on{display:block}

/* Card list */
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--warm-dark);animation:fadeUp .3s ease both}
.thumb{width:48px;height:60px;border-radius:var(--r-sm);object-fit:cover;flex-shrink:0}
.info{flex:1;min-width:0}
.name{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.surname{font-size:12px;color:var(--text-light);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em}
.stats{font-size:11px;color:var(--text-light);margin-top:3px}
.actions{display:flex;gap:4px;flex-shrink:0}
.edit-row{display:flex;gap:6px}
.edit-row input{flex:1;padding:7px 10px;font-size:14px;min-width:0}
.edit-row button{padding:7px 14px;border-radius:10px;border:none;background:var(--accent);color:#000;font-size:12px;font-weight:600;cursor:pointer;font-family:var(--font-b)}

.empty{text-align:center;padding:50px 20px;color:var(--text-light);font-size:14px;line-height:1.7}

/* Back button */
.back-btn{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--text-light);cursor:pointer;background:none;border:none;font-family:var(--font-b);padding:0;margin-bottom:16px}
.back-btn:active{opacity:.6}

/* Quiz */
.qbar{display:flex;justify-content:space-between;font-size:13px;color:var(--text-light);font-weight:600;margin-bottom:14px}
.track{height:4px;border-radius:3px;background:var(--warm-dark);margin-bottom:22px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:3px;transition:width .5s ease}
/* The frame is 4:5, like every student photo in the app. Bounding the width by
   44vh bounds the height by 55vh, so the judge buttons stay above the fold on a
   short screen without the ratio ever being sacrificed. */
.q-photo-wrap{width:min(100%,44vh);aspect-ratio:4/5;border-radius:var(--r-lg);overflow:hidden;border:1.5px solid var(--warm-dark);margin:0 auto 18px;background:var(--surface);position:relative;cursor:pointer;-webkit-user-select:none;user-select:none}
.q-photo{width:100%;height:100%;object-fit:cover;display:block}
.tap-hint{position:absolute;bottom:0;left:0;right:0;padding:12px;text-align:center;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.45));pointer-events:none;transition:opacity .3s}
.tap-hint.hide{opacity:0}
.tap-prompt{font-size:15px;color:var(--text-light);font-weight:600;margin-bottom:4px}
.judge-btns{display:flex;gap:10px;margin-top:8px}
.judge-yes{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--accent-light);color:var(--correct);border-radius:var(--r-sm);padding:14px;font-size:15px;font-weight:700;border:none;cursor:pointer;font-family:var(--font-b);transition:transform .15s}
.judge-no{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;background:var(--red-light);color:var(--wrong);border-radius:var(--r-sm);padding:14px;font-size:15px;font-weight:700;border:none;cursor:pointer;font-family:var(--font-b);transition:transform .15s}
.judge-yes:active,.judge-no:active{transform:scale(.96)}

.res{text-align:center;animation:fadeUp .25s ease}
.badge{display:inline-block;padding:4px 14px;border-radius:var(--r-sm);font-size:13px;font-weight:700;margin-bottom:10px}
.badge-ok{background:var(--accent-light);color:var(--correct)}
.badge-ko{background:var(--red-light);color:var(--wrong)}
.ans{font-family:var(--font-d);font-weight:600;font-size:24px;margin-bottom:4px}
.ans-surname{font-size:16px;color:var(--text-light);margin-bottom:18px;text-transform:uppercase;letter-spacing:.04em}

.fin{text-align:center;padding:36px 0;animation:fadeUp .4s ease}
.fin-n{font-family:var(--font-d);font-weight:600;font-size:34px;margin-bottom:24px}
.fin-b{display:flex;gap:8px;flex-direction:column}

.setup-box{padding:20px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--warm-dark)}
.setup-box .lbl{margin-bottom:16px}
.setup-options{display:flex;flex-wrap:wrap;gap:8px}
.setup-opt{padding:12px 0;border-radius:var(--r-sm);border:1.5px solid var(--warm-dark);font-size:15px;font-weight:600;font-family:var(--font-b);cursor:pointer;background:var(--surface-2);color:var(--text);transition:all .2s;flex:1;min-width:70px;text-align:center}
.setup-opt:active{transform:scale(.96)}
.setup-opt:hover{border-color:var(--accent-deep);color:var(--accent-deep)}

/* IO bar */
.io-bar{margin-top:28px;padding-top:20px;border-top:1px solid var(--warm-dark);display:flex;gap:8px}
.io-bar .btn{font-size:13px;padding:11px 16px}

/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--accent);color:#000;padding:10px 20px;border-radius:var(--r-sm);font-size:13px;font-weight:600;z-index:200;animation:toastIn .3s ease,toastOut .3s ease 2s forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes toastOut{from{opacity:1}to{opacity:0}}

/* Confirm */
.confirm-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.62);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.confirm-box{background:var(--surface);border-radius:var(--r-lg);padding:24px;max-width:300px;width:90%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.confirm-box p{font-size:15px;margin-bottom:18px;line-height:1.5}
.confirm-btns{display:flex;gap:8px}
.confirm-btns button{flex:1}

/* Small phones */
@media (max-width:360px){
  #app{padding:0 14px 60px}
  header{padding:18px 0 14px;margin-bottom:18px}
  header h1{font-size:22px}
  .header-right{gap:6px}
  .lang-btn{padding:4px 7px;font-size:10px}
  .nav{gap:4px}
  .nav button{padding:7px 12px;font-size:12px}
  .judge-yes,.judge-no{padding:14px 8px;font-size:14px}
  .item,.folder-item{gap:8px}
  .item{padding:10px 10px}
  .thumb{width:44px;height:55px}
  .item .grip,.folder-item .grip{width:24px}
  .actions .btn-icon,.actions .btn-d,.folder-actions .btn-icon,.folder-actions .btn-d{padding:4px 4px}
  .actions,.folder-actions{gap:3px}
}

/* Crop tool */
.crop-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.68);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .15s ease;touch-action:none;overscroll-behavior:contain}
.crop-box{background:var(--surface);border-radius:var(--r-lg);padding:20px;max-width:400px;width:100%;box-shadow:0 10px 30px rgba(0,0,0,.6)}
/* Black, not near-black: what shows around a photo that is not 4:5 is exactly
   what the rendered photo will carry. */
.crop-stage{position:relative;margin:0 auto;background:#000;border-radius:var(--r-sm);overflow:hidden;touch-action:none}
.crop-stage img{display:block;pointer-events:none;user-select:none;-webkit-user-select:none}
.crop-sel{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);cursor:move;touch-action:none}
/* Corner brackets sit INSIDE the frame, so they are never clipped by the edge of
   the image the way outside-hanging knobs were. */
.crop-handle{position:absolute;width:30px;height:30px;touch-action:none}
.crop-handle::after{content:"";position:absolute;width:15px;height:15px;border:3px solid #fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.55))}
.crop-handle[data-h="nw"]{left:-1px;top:-1px;cursor:nwse-resize}
.crop-handle[data-h="ne"]{right:-1px;top:-1px;cursor:nesw-resize}
.crop-handle[data-h="sw"]{left:-1px;bottom:-1px;cursor:nesw-resize}
.crop-handle[data-h="se"]{right:-1px;bottom:-1px;cursor:nwse-resize}
.crop-handle[data-h="nw"]::after{left:0;top:0;border-right:0;border-bottom:0}
.crop-handle[data-h="ne"]::after{right:0;top:0;border-left:0;border-bottom:0}
.crop-handle[data-h="sw"]::after{left:0;bottom:0;border-right:0;border-top:0}
.crop-handle[data-h="se"]::after{right:0;bottom:0;border-left:0;border-top:0}
.crop-reset{display:block;margin:12px auto 0;background:none;border:0;padding:6px 10px;color:var(--accent);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.crop-btns{display:flex;gap:8px;margin-top:8px}
.crop-btns button{flex:1}

/* Drag-to-reorder */
.grip{flex-shrink:0;width:28px;align-self:stretch;display:flex;align-items:center;justify-content:center;color:var(--text-light);cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none}
.grip:active{cursor:grabbing;color:var(--accent-deep)}
.reordering{position:relative;z-index:3;box-shadow:0 8px 22px rgba(0,0,0,.6);opacity:.96;cursor:grabbing}
.reordering,.shifting{animation:none !important}
.shifting{transition:transform .16s ease}

/* Trombinoscope import */
.sheet-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:var(--warm);z-index:160;overflow-y:auto;animation:fadeIn .15s ease;overscroll-behavior:contain}
.sheet-inner{max-width:520px;margin:0 auto;padding:16px 18px 30px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.sheet-title{font-family:var(--font-d);font-size:19px;font-weight:600;color:var(--accent-deep)}
.sheet-close{width:34px;height:34px;flex-shrink:0;border-radius:var(--r-sm);border:1.5px solid var(--warm-dark);background:var(--surface);color:var(--text-light);cursor:pointer;display:flex;align-items:center;justify-content:center}
.sheet-hint{font-size:12.5px;color:var(--text-light);line-height:1.5;margin-bottom:12px}
.sheet-viewport{position:relative;overflow:auto;background:#25241F;border-radius:var(--r-md);height:44vh;min-height:210px;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}
.sheet-canvas{position:relative}
.sheet-canvas img{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-select:none;user-select:none}
.sheet-sel{position:absolute;border:2px solid var(--accent);box-shadow:0 0 0 9999px rgba(0,0,0,.5);cursor:move;touch-action:none}
.sheet-handle{position:absolute;width:30px;height:30px;touch-action:none}
.sheet-handle::after{content:"";position:absolute;width:15px;height:15px;border:3px solid var(--accent);filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.sheet-handle[data-h="nw"]{left:-1px;top:-1px;cursor:nwse-resize}
.sheet-handle[data-h="ne"]{right:-1px;top:-1px;cursor:nesw-resize}
.sheet-handle[data-h="sw"]{left:-1px;bottom:-1px;cursor:nesw-resize}
.sheet-handle[data-h="se"]{right:-1px;bottom:-1px;cursor:nwse-resize}
.sheet-handle[data-h="nw"]::after{left:0;top:0;border-right:0;border-bottom:0}
.sheet-handle[data-h="ne"]::after{right:0;top:0;border-left:0;border-bottom:0}
.sheet-handle[data-h="sw"]::after{left:0;bottom:0;border-right:0;border-top:0}
.sheet-handle[data-h="se"]::after{right:0;bottom:0;border-left:0;border-top:0}
.sheet-bar{display:flex;align-items:center;gap:9px;margin:11px 0 14px}
.sheet-bar input[type=range]{flex:1;min-width:0;accent-color:var(--accent-deep)}
.zoom-btn{width:34px;height:34px;flex-shrink:0;border-radius:var(--r-sm);border:1.5px solid var(--warm-dark);background:var(--surface);color:var(--accent-deep);font-family:var(--font-b);font-size:17px;font-weight:700;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.zoom-btn:active{transform:scale(.94)}
.sheet-pages{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--text-light);flex-shrink:0}
.sheet-pages button{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--warm-dark);background:var(--surface);color:var(--accent-deep);font-family:var(--font-b);font-size:14px;font-weight:700;cursor:pointer}
.sheet-pages button:disabled{opacity:.35;cursor:default}
.sheet-fields{display:flex;gap:8px;margin-bottom:10px}
.sheet-fields .inp{flex:1;min-width:0}
.sheet-added-lbl{font-size:12px;color:var(--text-light);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin:20px 0 10px}
.sheet-added{display:flex;flex-wrap:wrap;gap:7px}
.sheet-added figure{width:52px}
.sheet-added img{width:52px;height:65px;object-fit:cover;border-radius:var(--r-sm);border:1.5px solid var(--warm-dark);display:block}
.sheet-added figcaption{font-size:10px;color:var(--text-light);margin-top:3px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-loading{display:flex;align-items:center;justify-content:center;height:44vh;min-height:210px;color:var(--text-light);font-size:14px;font-weight:600}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 onclick="goHome()">Visages</h1>
    <div class="header-right">
      <button class="lang-btn" id="langBtn" onclick="toggleLang()">EN</button>
      <div class="nav" id="navBar">
        <button id="navDeck" class="active" onclick="showDeck()" data-i18n="nav_cards">Élèves</button>
        <button id="navQuiz" onclick="startQuiz()" data-i18n="nav_quiz">Quiz</button>
      </div>
    </div>
  </header>

  <!-- ===== FOLDERS VIEW ===== -->
  <div id="foldersView">
    <div class="add-box">
      <div class="lbl" data-i18n="new_class">Nouvelle classe</div>
      <input type="text" id="folderInput" class="inp mb" data-i18n-placeholder="class_placeholder" placeholder="Ex : L1 Maths 2026" onkeydown="if(event.key==='Enter')addFolder()">
      <button class="btn btn-p" id="addFolderBtn" onclick="addFolder()" disabled data-i18n="create">Créer</button>
    </div>
    <div class="section-lbl" id="foldersCount"></div>
    <div class="folder-list" id="folderList"></div>
    <div class="empty hidden" id="foldersEmpty"><span data-i18n="empty_folders">Crée une classe pour commencer<br>à ajouter des élèves.</span></div>
    <div class="io-bar hidden" id="ioBarGlobal">
      <button class="btn btn-s" onclick="document.getElementById('importGlobalInput').click()"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"/><path d="M7.5 10.5 12 15l4.5-4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg><span data-i18n="import_class">Importer une classe (.json)</span></button>
      <input type="file" id="importGlobalInput" accept=".json" onchange="importFolder(event)" style="display:none">
    </div>
  </div>

  <!-- ===== DECK VIEW ===== -->
  <div id="deckView" class="hidden">
    <button class="back-btn" onclick="goHome()" data-i18n="back_classes">← Classes</button>
    <div class="add-box">
      <div class="lbl" data-i18n="add_person">Ajouter un.e élève</div>
      <img id="preview" class="preview" alt="aperçu">
      <input type="file" id="fileInput" accept="image/*" onchange="onPhoto(event)" style="display:none">
      <button class="btn btn-s mb" onclick="document.getElementById('fileInput').click()">
        <svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.4"/></svg>
        <span id="photoLbl" data-i18n="choose_photo">Choisir une photo</span>
      </button>
      <button class="btn btn-s mb hidden" id="cropTriggerBtn" onclick="cropPending()">

const DB="visages_db2", VER=1, S_FOLDERS="folders", S_CARDS="cards";
let db=null;

function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB,VER);
    r.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains(S_FOLDERS)) d.createObjectStore(S_FOLDERS,{keyPath:"id"});
      if(!d.objectStoreNames.contains(S_CARDS)){
        const s=d.createObjectStore(S_CARDS,{keyPath:"id"});
        s.createIndex("folderId","folderId",{unique:false});
      }
    };
    r.onsuccess=e=>{db=e.target.result;res(db)};
    r.onerror=e=>rej(e);
  });
}
function dbAll(store){return new Promise((res,rej)=>{const r=db.transaction(store,"readonly").objectStore(store).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=e=>rej(e)})}
function dbPut(store,obj){return new Promise((res,rej)=>{const r=db.transaction(store,"readwrite").objectStore(store).put(obj);r.onsuccess=()=>res();r.onerror=e=>rej(e)})}
function dbDel(store,id){return new Promise((res,rej)=>{const r=db.transaction(store,"readwrite").objectStore(store).delete(id);r.onsuccess=()=>res();r.onerror=e=>rej(e)})}
function dbByIndex(store,idx,val){return new Promise((res,rej)=>{const r=db.transaction(store,"readonly").objectStore(store).index(idx).getAll(val);r.onsuccess=()=>res(r.result||[]);r.onerror=e=>rej(e)})}

// ================ Helpers ================
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim()}
function nextOrder(list){return list.length?Math.max(...list.map(x=>x.order||0))+1:0}
// Records created before drag-to-reorder existed have no `order`; sort is stable,
// so they keep their insertion order and get numbered on first load.
async function ensureOrder(list,store){
  list.sort((a,b)=>(a.order==null?1e9:a.order)-(b.order==null?1e9:b.order));
  for(let i=0;i<list.length;i++) if(list[i].order!==i){list[i].order=i;await dbPut(store,list[i])}
  return list;
}

// Freeze the page behind a full-screen overlay: without this, a touch that misses
// the crop frame scrolls the list underneath.
let scrollLockY=0, scrollLocks=0;
function lockScroll(on){
  if(on){
    if(scrollLocks++) return;
    scrollLockY=window.scrollY||0;
    const b=document.body.style;
    b.position="fixed";b.top=(-scrollLockY)+"px";b.left="0";b.right="0";b.width="100%";
  }else{
    if(scrollLocks===0||--scrollLocks>0) return;
    const b=document.body.style;
    b.position="";b.top="";b.left="";b.right="";b.width="";
    window.scrollTo(0,scrollLockY);
  }
}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function esc(s){const d=document.createElement("div");d.textContent=s;return d.innerHTML}

// ================ Photo ================
// Cropping is never destructive: a record keeps the original image in `src` and a
// `crop` rectangle in 0..1 units of it. `photo` is only the rendered result, kept
// so every display site (thumbnails, quiz, export) stays a plain <img src>.
// Normalised units mean the rectangle survives any later re-encode or resize.
const SRC_MAX=1024;    // longest side kept for the original
const PHOTO_MAX=640;   // longest side of the rendered crop

// Draw a region of `img` into a JPEG data URL, downscaled to fit `max`.
function drawCrop(img,sx,sy,sw,sh,max,q){
  let w=sw,h=sh;
  if(w>max||h>max){if(w>h){h=h*max/w;w=max}else{w=w*max/h;h=max}}
  const c=document.createElement("canvas");
  c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));
  const ctx=c.getContext("2d");
  // A 4:5 frame on a photo that is not 4:5 reaches past the image. drawImage
  // clips the part that exists and leaves the rest of the canvas alone, so the
  // black bands the crop tool displayed have to be painted here.
  ctx.fillStyle="#000";ctx.fillRect(0,0,c.width,c.height);
  ctx.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",q||.82);
}
function cropRect(img,crop){
  const c=crop||{x:0,y:0,w:1,h:1},W=img.naturalWidth,H=img.naturalHeight;
  return[c.x*W,c.y*H,Math.max(1,c.w*W),Math.max(1,c.h*H)];
}
async function renderCropView(srcData,crop){
  const img=await loadImg(srcData);
  return drawCrop(img,...cropRect(img,crop),PHOTO_MAX,.82);
}
// Records made before cropping became reversible only have `photo`; it becomes
// their original. Nothing already discarded can be recovered, but from now on
// every crop of them is undoable.
function cardSrc(card){return card.src||card.photo}

async function onPhoto(e){
  const file=e.target.files&&e.target.files[0];
  if(!file) return;
  try{
    const dataUrl=await new Promise((res,rej)=>{
      const r=new FileReader();r.onload=ev=>res(ev.target.result);r.onerror=rej;r.readAsDataURL(file);
    });
    const img=await loadImg(dataUrl);
    pendingSrc=drawCrop(img,0,0,img.naturalWidth,img.naturalHeight,SRC_MAX,.85);
    pendingCrop=null;
    pendingPhoto=drawCrop(img,0,0,img.naturalWidth,img.naturalHeight,PHOTO_MAX,.82);
    const prev=document.getElementById("preview");
    prev.src=pendingPhoto;prev.classList.add("on");
    document.getElementById("photoLbl").textContent=t("change_photo");
    updAdd();

function cropPending(){

async function cropCard(id){

// ================ Crop tool ================
let cropState=null;
// Every student photo is displayed in a 4:5 portrait box, so the frame is locked
// to that ratio. A photo that is not 4:5 would otherwise be impossible to frame
// whole, so it is laid on a 4:5 black stage: the frame can then take in the
// entire image, bands included, and what those bands cover is what the rendered
// photo will carry. The stage is shown in full with the current crop as the
// starting frame, so dragging a handle outwards takes back a part that was cut.
const CROP_RATIO=4/5;   // width / height
const CROP_MIN_W=72;    // narrowest frame, in display pixels

// The smallest 4:5 box holding the whole image, and where the image sits in it.
function padTo45(w,h){
  const sw=Math.max(w,h*CROP_RATIO),sh=Math.max(h,w/CROP_RATIO);
  return{sw,sh,offX:(sw-w)/2,offY:(sh-h)/2};
}
// A crop stored before the ratio was imposed can be any shape: grow it to 4:5
// rather than cut into it, so nothing already framed is lost, then bring it back
// inside the stage.
function fitCropRatio(s){
  const st=cropState;
  let w=Math.max(s.w,s.h*CROP_RATIO),h=w/CROP_RATIO;
  const k=Math.min(1,st.stageW/w,st.stageH/h);
  w*=k;h*=k;
  const cx=s.x+s.w/2,cy=s.y+s.h/2;
  return{x:Math.min(Math.max(0,cx-w/2),st.stageW-w),y:Math.min(Math.max(0,cy-h/2),st.stageH-h),w,h};
}
function openCropper(dataUrl,crop,onDone){
  const img=new Image();
  img.onload=()=>{
    const pad=padTo45(img.naturalWidth,img.naturalHeight);
    const maxW=Math.min(360,window.innerWidth-64);
    const maxH=Math.min(420,window.innerHeight-220);
    const fit=Math.min(maxW/pad.sw,maxH/pad.sh,1);
    cropState={src:dataUrl,onDone,drag:null,sel:null,
      stageW:Math.round(pad.sw*fit),stageH:Math.round(pad.sh*fit),
      imgW:Math.round(img.naturalWidth*fit),imgH:Math.round(img.naturalHeight*fit),
      offX:Math.round(pad.offX*fit),offY:Math.round(pad.offY*fit)};
    const s=cropState;
    cropState.sel=crop
      ?fitCropRatio({x:s.offX+crop.x*s.imgW,y:s.offY+crop.y*s.imgH,w:crop.w*s.imgW,h:crop.h*s.imgH})
      :{x:0,y:0,w:s.stageW,h:s.stageH};
    renderCropper();
  };
  img.src=dataUrl;
}
function resetCrop(){
  if(!cropState) return;
  cropState.sel={x:0,y:0,w:cropState.stageW,h:cropState.stageH};
  layoutCropSel();
}
function renderCropper(){
  lockScroll(true);
  const o=document.getElementById("cropOverlay");
  o.className="crop-overlay";
  o.innerHTML=`<div class="crop-box">
    <div class="crop-stage" id="cropStage" style="width:${cropState.stageW}px;height:${cropState.stageH}px">
      <img src="${cropState.src}" style="position:absolute;left:${cropState.offX}px;top:${cropState.offY}px;width:${cropState.imgW}px;height:${cropState.imgH}px" alt="">
      <div class="crop-sel" id="cropSel">
        <div class="crop-handle" data-h="nw"></div>
        <div class="crop-handle" data-h="ne"></div>
        <div class="crop-handle" data-h="sw"></div>
        <div class="crop-handle" data-h="se"></div>
      </div>
    </div>
    <button class="crop-reset" onclick="resetCrop()">${t("crop_full")}<\/button>
    <div class="crop-btns">
      <button class="btn btn-s" onclick="closeCropper()">${t("cancel")}<\/button>
      <button class="btn btn-p" onclick="confirmCrop()">${t("crop_apply")}<\/button>
    </div>
  </div>`;
  layoutCropSel();
  const sel=document.getElementById("cropSel");
  sel.addEventListener("pointerdown",e=>startCropDrag(e,"move"));
  sel.querySelectorAll(".crop-handle").forEach(h=>{
    h.addEventListener("pointerdown",e=>{e.stopPropagation();startCropDrag(e,h.dataset.h)});
  });
}
function layoutCropSel(){
  const sel=document.getElementById("cropSel");
  if(!sel||!cropState) return;
  const s=cropState.sel;
  sel.style.left=s.x+"px";sel.style.top=s.y+"px";sel.style.width=s.w+"px";sel.style.height=s.h+"px";
}
// Resize a frame by one of its corners without leaving the 4:5 ratio: the
// opposite corner stays put, the size follows whichever axis the pointer pushed
// furthest, and the result is held inside the box the frame lives in. Shared by
// the crop tool and the trombinoscope frame, which only differ by that box.
function resizeKeepRatio(mode,st,dx,dy,boxW,boxH,minW){
  const west=mode.includes("w"),north=mode.includes("n");
  const ax=west?st.x+st.w:st.x, ay=north?st.y+st.h:st.y;   // the anchored corner
  let w=Math.abs((west?st.x+dx:st.x+st.w+dx)-ax);
  const h=Math.abs((north?st.y+dy:st.y+st.h+dy)-ay);
  if(h*CROP_RATIO>w) w=h*CROP_RATIO;
  const room=Math.min(west?ax:boxW-ax,(north?ay:boxH-ay)*CROP_RATIO);
  w=Math.max(Math.min(w,room),Math.min(minW,room));
  const nh=w/CROP_RATIO;
  return{x:west?ax-w:ax,y:north?ay-nh:ay,w,h:nh};
}
function startCropDrag(e,mode){
  e.preventDefault();
  const startX=e.clientX,startY=e.clientY;
  const startSel={...cropState.sel};
  const W=cropState.stageW,H=cropState.stageH;
  function onMove(ev){
    const dx=ev.clientX-startX,dy=ev.clientY-startY;
    if(mode==="move"){
      cropState.sel={...startSel,
        x:Math.min(Math.max(0,startSel.x+dx),W-startSel.w),
        y:Math.min(Math.max(0,startSel.y+dy),H-startSel.h)};
    }else{
      cropState.sel=resizeKeepRatio(mode,startSel,dx,dy,W,H,CROP_MIN_W);
    }
    layoutCropSel();
  }
  function onUp(){
    document.removeEventListener("pointermove",onMove);
    document.removeEventListener("pointerup",onUp);
  }
  document.addEventListener("pointermove",onMove);
  document.addEventListener("pointerup",onUp);
}
function closeCropper(){
  document.getElementById("cropOverlay").className="hidden";
  cropState=null;
  lockScroll(false);
}
function confirmCrop(){
  if(!cropState) return;
  const{sel,imgW,imgH,offX,offY,onDone}=cropState;
  // Measured against the image, not against the padded stage: a frame reaching
  // into the black bands lands outside 0..1, which is exactly what drawCrop
  // paints black.
  const crop={x:(sel.x-offX)/imgW,y:(sel.y-offY)/imgH,w:sel.w/imgW,h:sel.h/imgH};
  closeCropper();
  onDone(crop);
}

// ================ Trombinoscope import ================
// A full sheet (JPG/PNG, or a PDF page rendered to a canvas) is shown in a
// zoomable/pannable viewport. The user places a frame over each face, types the
// name, and the frame auto-advances to the next face using the grid pitch it
// learned from the previous two placements.
let sheet=null;
const SHEET_MAX_PX=2600;   // longest side kept for the sheet itself
const SHEET_PDF_PX=2200;   // target width when rasterising a PDF page

function loadPdfJs(){
  if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return new Promise((res,rej)=>{
    const s=document.createElement("script");
    s.src="vendor/pdfjs/pdf.min.js";
    s.onload=()=>{
      if(!window.pdfjsLib) return rej(new Error("pdfjs missing"));
      window.pdfjsLib.GlobalWorkerOptions.workerSrc="vendor/pdfjs/pdf.worker.min.js";
      res(window.pdfjsLib);
    };
    s.onerror=()=>rej(new Error("pdfjs unreachable"));
    document.head.appendChild(s);
  });
}

function loadImg(src){
  return new Promise((res,rej)=>{
    const i=new Image();
    i.onload=()=>res(i);
    i.onerror=rej;
    i.src=src;
  });
}

// Normalise any bitmap file into a sheet-sized JPEG data URL (also applies EXIF rotation).
async function fileToSheet(file){
  const dataUrl=await new Promise((res,rej)=>{
    const r=new FileReader();r.onload=ev=>res(ev.target.result);r.onerror=rej;r.readAsDataURL(file);
  });
  const img=await loadImg(dataUrl);
  let w=img.naturalWidth,h=img.naturalHeight;
  if(w<=SHEET_MAX_PX&&h<=SHEET_MAX_PX) return dataUrl;
  if(w>h){h=Math.round(h*SHEET_MAX_PX/w);w=SHEET_MAX_PX}else{w=Math.round(w*SHEET_MAX_PX/h);h=SHEET_MAX_PX}
  const c=document.createElement("canvas");c.width=w;c.height=h;
  c.getContext("2d").drawImage(img,0,0,w,h);
  return c.toDataURL("image/jpeg",.9);
}

async function pdfPageToSheet(doc,n){
  const page=await doc.getPage(n);
  const base=page.getViewport({scale:1});
  const vp=page.getViewport({scale:Math.min(SHEET_PDF_PX/base.width,3)});
  const c=document.createElement("canvas");
  c.width=Math.round(vp.width);c.height=Math.round(vp.height);
  const ctx=c.getContext("2d");
  ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height); // PDFs are transparent; JPEG would go black
  // intent "print" is the offscreen path: pdf.js chains its render chunks with
  // promises instead of requestAnimationFrame, which never fires while the tab
  // is hidden — otherwise switching apps mid-import stalls the render forever.
  await page.render({canvasContext:ctx,viewport:vp,intent:"print"}).promise;
  return c.toDataURL("image/jpeg",.9);
}

async function onSheetFile(e){
  const file=e.target.files&&e.target.files[0];
  e.target.value="";
  if(!file||!currentFolder) return;
  lockScroll(true);
  const o=document.getElementById("sheetOverlay");
  o.className="sheet-overlay";
  o.innerHTML=`<div class="sheet-inner"><div class="sheet-loading">${t("sheet_loading")}<\/div><\/div>`;
  try{
    if(file.type==="application/pdf"||/\.pdf$/i.test(file.name)){
      const lib=await loadPdfJs();
      const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise;
      await openSheet(await pdfPageToSheet(doc,1),{pdfDoc:doc,pages:doc.numPages,page:1});
    }else{
      await openSheet(await fileToSheet(file),{pdfDoc:null,pages:1,page:1});
    }
  }catch(err){
    o.className="hidden";sheet=null;lockScroll(false);
    showToast(t("sheet_bad_file"));
  }
}

async function openSheet(src,meta){
  const img=await loadImg(src);
  const keep=sheet; // switching PDF page: keep what we already collected
  sheet={
    src,img,natW:img.naturalWidth,natH:img.naturalHeight,
    pdfDoc:meta.pdfDoc,pages:meta.pages,page:meta.page,
    zoom:1,minZoom:1,maxZoom:1,
    sel:null,
    added:keep?keep.added:[],
    lastAdd:null,pitchX:0,pitchY:0,rowX0:0
  };
  // Start near the top-left, where the first portrait of a sheet almost always
  // sits. The frame is 4:5 like every student photo in the app, so what gets
  // framed on the sheet is exactly what will be displayed.
  const side=Math.round(Math.min(sheet.natW,sheet.natH)/6);
  const s=Math.max(50,Math.min(side,sheet.natH,sheet.natW/CROP_RATIO));
  sheet.sel={x:0,y:0,w:s*CROP_RATIO,h:s};
  placeSel(Math.round(sheet.natW*0.06),Math.round(sheet.natH*0.12));
  renderSheet();
}

function renderSheet(){
  const pg=sheet.pages>1?`<div class="sheet-pages">
      <button onclick="sheetPage(-1)" ${sheet.page<=1?"disabled":""} aria-label="-">‹<\/button>
      <span>${t("sheet_page")} ${sheet.page}/${sheet.pages}<\/span>
      <button onclick="sheetPage(1)" ${sheet.page>=sheet.pages?"disabled":""} aria-label="+">›<\/button>
    <\/div>`:"";
  const o=document.getElementById("sheetOverlay");
  o.className="sheet-overlay";
  o.innerHTML=`<div class="sheet-inner">
    <div class="sheet-head">
      <span class="sheet-title">${t("sheet_title")}<\/span>
      <button class="sheet-close" onclick="closeSheet()" aria-label="${t("sheet_done")}">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/><\/svg>
      <\/button>
    <\/div>
    <div class="sheet-hint">${t("sheet_hint")}<\/div>
    <div class="sheet-viewport" id="sheetViewport">
      <div class="sheet-canvas" id="sheetCanvas">
        <img src="${sheet.src}" alt="">
        <div class="sheet-sel" id="sheetSel">
          <div class="sheet-handle" data-h="nw"><\/div>
          <div class="sheet-handle" data-h="ne"><\/div>
          <div class="sheet-handle" data-h="sw"><\/div>
          <div class="sheet-handle" data-h="se"><\/div>
        <\/div>
      <\/div>
    <\/div>
    <div class="sheet-bar">
      <button class="zoom-btn" onclick="sheetZoomStep(-1)" aria-label="zoom -">−<\/button>
      <input type="range" id="sheetZoom" min="0" max="100" value="0" oninput="sheetZoomTo(+this.value)" aria-label="zoom">
      <button class="zoom-btn" onclick="sheetZoomStep(1)" aria-label="zoom +">+<\/button>
      ${pg}
    <\/div>
    <div class="sheet-fields">
      <input type="text" id="sheetFn" class="inp" placeholder="${t("first_name")}" oninput="updSheetAdd()" onkeydown="if(event.key==='Enter')document.getElementById('sheetLn').focus()">
      <input type="text" id="sheetLn" class="inp" placeholder="${t("last_name_short")}" style="text-transform:uppercase" oninput="updSheetAdd()" onkeydown="if(event.key==='Enter')sheetAdd()">
    <\/div>
    <button class="btn btn-p" id="sheetAddBtn" onclick="sheetAdd()" disabled>${t("sheet_add")}<\/button>
    <div id="sheetAddedWrap"><\/div>
    <button class="btn btn-s mt" onclick="closeSheet()">${t("sheet_done")}<\/button>
  <\/div>`;

  const vp=document.getElementById("sheetViewport");
  // Fit the whole sheet on screen first, allow up to 4x that (and never below 1:1 usefulness).
  sheet.minZoom=Math.min(vp.clientWidth/sheet.natW,1);
  sheet.maxZoom=Math.max(sheet.minZoom*6,1.2);
  sheet.zoom=sheet.minZoom;
  layoutSheet();
  renderSheetAdded();
  bindSheetPointers();
}

function layoutSheet(){
  const cv=document.getElementById("sheetCanvas");
  if(!cv||!sheet) return;
  cv.style.width=Math.round(sheet.natW*sheet.zoom)+"px";
  cv.style.height=Math.round(sheet.natH*sheet.zoom)+"px";
  const z=Math.log(sheet.zoom/sheet.minZoom)/Math.log(sheet.maxZoom/sheet.minZoom);
  const sl=document.getElementById("sheetZoom");
  if(sl) sl.value=Math.round(z*100);
  layoutSel();
}

function layoutSel(){
  const el=document.getElementById("sheetSel");
  if(!el||!sheet) return;
  const{x,y,w,h}=sheet.sel,z=sheet.zoom;
  el.style.left=x*z+"px";el.style.top=y*z+"px";
  el.style.width=w*z+"px";el.style.height=h*z+"px";
}

function sheetZoomTo(v){
  const vp=document.getElementById("sheetViewport");
  const old=sheet.zoom;
  // Keep whatever is at the centre of the viewport at the centre after zooming.
  const cx=(vp.scrollLeft+vp.clientWidth/2)/old, cy=(vp.scrollTop+vp.clientHeight/2)/old;
  sheet.zoom=sheet.minZoom*Math.pow(sheet.maxZoom/sheet.minZoom,Math.min(100,Math.max(0,v))/100);
  layoutSheet();
  vp.scrollLeft=cx*sheet.zoom-vp.clientWidth/2;
  vp.scrollTop=cy*sheet.zoom-vp.clientHeight/2;
}

function sheetZoomStep(dir){
  const cur=+document.getElementById("sheetZoom").value;
  sheetZoomTo(cur+dir*12);
}

function scrollSelIntoView(){
  const vp=document.getElementById("sheetViewport");
  if(!vp) return;
  const{x,y,w,h}=sheet.sel,z=sheet.zoom;
  vp.scrollLeft=(x+w/2)*z-vp.clientWidth/2;
  vp.scrollTop=(y+h/2)*z-vp.clientHeight/2;
}

function placeSel(x,y){
  const s=sheet.sel;
  s.x=Math.min(Math.max(0,Math.round(x)),sheet.natW-s.w);
  s.y=Math.min(Math.max(0,Math.round(y)),sheet.natH-s.h);
  layoutSel();
}

function bindSheetPointers(){
  const vp=document.getElementById("sheetViewport");
  const cv=document.getElementById("sheetCanvas");
  const sel=document.getElementById("sheetSel");
  sel.addEventListener("pointerdown",e=>startSheetDrag(e,"move"));
  sel.querySelectorAll(".sheet-handle").forEach(h=>{
    h.addEventListener("pointerdown",e=>{e.stopPropagation();startSheetDrag(e,h.dataset.h)});
  });
  // Tap on bare image = drop the frame there. A drag/scroll must not count as a tap.
  let tap=null;
  cv.addEventListener("pointerdown",e=>{
    if(e.target.closest(".sheet-sel")) return;
    tap={x:e.clientX,y:e.clientY,sl:vp.scrollLeft,st:vp.scrollTop};
  });
  cv.addEventListener("pointercancel",()=>{tap=null});
  cv.addEventListener("pointerup",e=>{
    if(!tap) return;
    const moved=Math.abs(e.clientX-tap.x)>8||Math.abs(e.clientY-tap.y)>8;
    const scrolled=Math.abs(vp.scrollLeft-tap.sl)>2||Math.abs(vp.scrollTop-tap.st)>2;
    tap=null;
    if(moved||scrolled) return;
    const r=cv.getBoundingClientRect();
    placeSel((e.clientX-r.left)/sheet.zoom-sheet.sel.w/2,(e.clientY-r.top)/sheet.zoom-sheet.sel.h/2);
  });
}

function startSheetDrag(e,mode){
  e.preventDefault();
  const z=sheet.zoom,x0=e.clientX,y0=e.clientY,st={...sheet.sel};
  const MIN=Math.round(72/z),W=sheet.natW,H=sheet.natH;
  function onMove(ev){
    const dx=(ev.clientX-x0)/z,dy=(ev.clientY-y0)/z;
    if(mode==="move"){
      sheet.sel={...st,
        x:Math.min(Math.max(0,st.x+dx),W-st.w),
        y:Math.min(Math.max(0,st.y+dy),H-st.h)};
    }else{
      sheet.sel=resizeKeepRatio(mode,st,dx,dy,W,H,MIN);
    }
    layoutSel();
  }
  function onUp(){
    document.removeEventListener("pointermove",onMove);
    document.removeEventListener("pointerup",onUp);
    document.removeEventListener("pointercancel",onUp);
  }
  document.addEventListener("pointermove",onMove);
  document.addEventListener("pointerup",onUp);
  document.addEventListener("pointercancel",onUp);
}

function updSheetAdd(){
  const btn=document.getElementById("sheetAddBtn");
  if(btn) btn.disabled=!document.getElementById("sheetFn").value.trim();
}

// Keeping the whole sheet once per student would be absurd, and keeping only the
// frame would make re-cropping pointless — so the stored original is the frame
// plus a margin, which is what "dérogner" can take back. The margin must stay
// inside the student's own cell: at 75 % of the frame on each side the stored
// rectangle was 2.5 frames wide, i.e. most of a row on a three-column sheet, so
// re-cropping reopened the neighbours' faces. It is now small by default, and
// once the grid pitch is known it never exceeds the free space around the frame
// in its cell. The rendered photo is drawn from the sheet itself, not from that
// copy, to avoid a second JPEG generation.
const SHEET_SRC_MARGIN=.22;
// Free space between the frame and the neighbouring cell, halved: that is how far
// the stored original can grow without catching another face.
function sheetSrcMargin(){
  const s=sheet.sel;
  // Cells scale on both axes, so the horizontal pitch stands in for the vertical
  // one until a row change has actually been observed — as in advanceSel().
  const px=sheet.pitchX,py=sheet.pitchY||(px?px*(s.h/s.w):0);
  return{
    mx:Math.min(s.w*SHEET_SRC_MARGIN,px?Math.max(0,(px-s.w)/2):Infinity),
    my:Math.min(s.h*SHEET_SRC_MARGIN,py?Math.max(0,(py-s.h)/2):Infinity)
  };
}
function cropFromSheet(){
  const{sel,img,natW,natH}=sheet;
  const{mx,my}=sheetSrcMargin();
  const x=Math.max(0,sel.x-mx),y=Math.max(0,sel.y-my);
  const w=Math.min(natW,sel.x+sel.w+mx)-x,h=Math.min(natH,sel.y+sel.h+my)-y;
  return{
    photo:drawCrop(img,sel.x,sel.y,sel.w,sel.h,PHOTO_MAX,.82),
    src:drawCrop(img,x,y,w,h,SRC_MAX,.85),
    crop:{x:(sel.x-x)/w,y:(sel.y-y)/h,w:sel.w/w,h:sel.h/h}
  };
}

async function sheetAdd(){
  if(!sheet||!currentFolder) return;
  const fnEl=document.getElementById("sheetFn"),lnEl=document.getElementById("sheetLn");
  const firstName=fnEl.value.trim(),lastName=lnEl.value.trim().toUpperCase();
  if(!firstName) return;
  const name=lastName?firstName+" "+lastName:firstName;
  const card={id:Date.now().toString()+Math.random().toString(36).slice(2,6),
    folderId:currentFolder.id,name,firstName,lastName,...cropFromSheet(),score:0,attempts:0,order:nextOrder(cards)};
  cards.push(card);await dbPut(S_CARDS,card);
  sheet.added.push(card);

  advanceSel();
  fnEl.value="";lnEl.value="";updSheetAdd();
  renderSheetAdded();
  fnEl.focus();
}

// Learn the grid pitch from consecutive placements, then jump to the next face.
function advanceSel(){
  const s=sheet.sel,prev=sheet.lastAdd;
  if(prev){
    const dx=s.x-prev.x,dy=s.y-prev.y;
    if(dx>s.w*0.3&&Math.abs(dy)<s.h*0.5) sheet.pitchX=dx;          // moved along the row
    else if(dy>s.h*0.3){sheet.pitchY=dy;sheet.rowX0=s.x}           // moved down to a new row
  }else{
    sheet.rowX0=s.x;
  }
  sheet.lastAdd={x:s.x,y:s.y};

  const px=sheet.pitchX||Math.round(s.w*1.1);
  // Grid cells scale on both axes, so a known horizontal pitch is the best guess
  // for the vertical one until an actual row change has been observed.
  const py=sheet.pitchY||Math.round(px*(s.h/s.w));
  let nx=s.x+px,ny=s.y;
  if(nx+s.w>sheet.natW){nx=sheet.rowX0;ny=s.y+py}
  if(ny+s.h>sheet.natH) return; // bottom of the sheet: leave the frame where it is
  placeSel(nx,ny);
  scrollSelIntoView();
}

  if(!sheet.added.length){wrap.innerHTML="";return}
  wrap.innerHTML=`<div class="sheet-added-lbl">${t("sheet_added_n")(sheet.added.length)}<\/div>

async function sheetPage(d){
  if(!sheet||!sheet.pdfDoc) return;
  const n=sheet.page+d;
  if(n<1||n>sheet.pages) return;
  const o=document.getElementById("sheetOverlay");

function closeSheet(){
  const n=sheet?sheet.added.length:0;
  document.getElementById("sheetOverlay").className="hidden";

  lockScroll(false);

document.addEventListener("keydown",e=>{

  if(sheet) closeSheet();
  else if(cropState) closeCropper();
});

function closeCfm(){document.getElementById("confirmOverlay").className="hidden"}

function startEditCard(id){editingId=id;renderDeck();const el=document.getElementById("edit-"+id);if(el)el.focus()}
async function saveEditCard(id){
  const fnEl=document.getElementById("editfn-"+id),lnEl=document.getElementById("editln-"+id);
  const firstName=fnEl?fnEl.value.trim():"";
  const lastName=lnEl?lnEl.value.trim().toUpperCase():"";
  if(!firstName) return;
  const card=cards.find(c=>c.id===id);
  if(card){card.firstName=firstName;card.lastName=lastName;card.name=lastName?firstName+" "+lastName:firstName;await dbPut(S_CARDS,card)}
  editingId=null;renderDeck();
}

// ================ Render Deck ================
function renderDeck(){
  const list=document.getElementById("cardList"),countEl=document.getElementById("countLbl");
  const ioEl=document.getElementById("ioBar");

  countEl.textContent=(currentFolder?esc(currentFolder.name)+" — ":"")+t("n_cards")(cards.length);

  if(!cards.length){
    list.innerHTML="";
    countEl.classList.add("hidden");
    ioEl.classList.add("hidden");
    return;
  }
  countEl.classList.remove("hidden");
  ioEl.classList.remove("hidden");

  list.innerHTML=cards.map((c,i)=>{
    const fn=c.firstName||c.name;
    const ln=c.lastName||"";
    if(editingId===c.id) return `<div class="item" style="animation-delay:${i*30}ms">
      <img src="${c.photo}" class="thumb" alt="">
      <div class="info"><div class="edit-row">
        <input id="editfn-${c.id}" class="inp" value="${esc(fn)}" placeholder="${t('first_name')}" onkeydown="if(event.key==='Enter')document.getElementById('editln-${c.id}').focus()">
        <input id="editln-${c.id}" class="inp" value="${esc(ln)}" placeholder="${t('last_name_short')}" style="text-transform:uppercase" onkeydown="if(event.key==='Enter')saveEditCard('${c.id}')">
        <button onclick="saveEditCard('${c.id}')">OK<\/button>
      <\/div><\/div><\/div>`;
    const lnHtml=ln?`<div class="surname">${esc(ln)}<\/div>`:"";
    const st=c.attempts>0?`<div class="stats">${c.score}/${c.attempts} ${t("correct")}<\/div>`:"";
    return `<div class="item" data-id="${c.id}" style="animation-delay:${i*30}ms">
      <div class="grip" aria-label="${t('reorder')}" onpointerdown="startReorder(event,'card')">${ICONS.grip}<\/div>
      <img src="${c.photo}" class="thumb" alt="${esc(fn)}">
      <div class="info"><div class="name">${esc(fn)}<\/div>${lnHtml}${st}<\/div>
      <div class="actions">
        <button class="btn-icon" aria-label="${t('crop_photo')}" onclick="cropCard('${c.id}')">${ICONS.crop}<\/button>
        <button class="btn-icon" aria-label="${t('edit')}" onclick="startEditCard('${c.id}')">${ICONS.edit}<\/button>
        <button class="btn-d" aria-label="${t('delete')}" onclick="confirmDel('${c.id}')">${ICONS.trash}<\/button>
      <\/div><\/div>`;
  }).join("");
}

// ================ Drag to reorder ================
// Rows never move in the DOM while dragging: the grabbed row follows the finger
// and the others slide by one slot, so nothing re-measures mid-gesture.
let reorder=null;

function startReorder(e,kind){
  if(e.button>0) return;
  const row=e.target.closest(kind==="card"?".item":".folder-item");
  if(!row||!row.parentElement) return;
  const list=row.parentElement, rows=[...list.children], i0=rows.indexOf(row);
  if(i0<0) return;
  e.preventDefault(); e.stopPropagation();
  const rects=rows.map(r=>r.getBoundingClientRect());
  reorder={kind,rows,i0,target:i0,moved:false,startY:e.clientY,
    centers:rects.map(r=>r.top+r.height/2), step:rects[i0].height+8};
  row.classList.add("reordering");
  rows.forEach((r,j)=>{if(j!==i0) r.classList.add("shifting")});
  document.addEventListener("pointermove",onReorderMove);
  document.addEventListener("pointerup",endReorder);
  document.addEventListener("pointercancel",endReorder);
}

function onReorderMove(ev){
  if(!reorder) return;
  const{rows,i0,centers,step}=reorder;
  const dy=ev.clientY-reorder.startY;
  if(Math.abs(dy)>3) reorder.moved=true;
  rows[i0].style.transform="translateY("+dy+"px)";
  // Commit against the midpoint between two slots, so half a row of travel is
  // enough to swap — comparing against the neighbour's centre would require
  // dragging a full row past it before anything happened.
  const c=centers[i0]+dy;
  let t=i0;
  while(t>0&&c<(centers[t-1]+centers[t])/2) t--;
  while(t<rows.length-1&&c>(centers[t]+centers[t+1])/2) t++;
  if(t===reorder.target) return;
  reorder.target=t;
  rows.forEach((r,j)=>{
    if(j===i0) return;
    const sh=(t>i0&&j>i0&&j<=t)?-step:(t<i0&&j<i0&&j>=t)?step:0;
    r.style.transform=sh?"translateY("+sh+"px)":"";
  });
}

async function endReorder(){
  document.removeEventListener("pointermove",onReorderMove);
  document.removeEventListener("pointerup",endReorder);
  document.removeEventListener("pointercancel",endReorder);
  if(!reorder) return;
  const{kind,rows,i0,target,moved}=reorder;
  rows.forEach(r=>{r.style.transform="";r.classList.remove("reordering","shifting")});
  reorder=null;
  if(!moved||target===i0) return;
  const arr=kind==="card"?cards:folders, store=kind==="card"?S_CARDS:S_FOLDERS;
  arr.splice(target,0,arr.splice(i0,1)[0]);
  for(let i=0;i<arr.length;i++) if(arr[i].order!==i){arr[i].order=i;await dbPut(store,arr[i])}
  if(kind==="card") renderDeck(); else renderFolders();
}

// ================ Quiz ================
function startQuiz(){
  if(cards.length<2){showToast(t("min_cards"));return}
  // Show setup screen
  document.getElementById("deckView").classList.add("hidden");
  document.getElementById("quizView").classList.remove("hidden");
  document.getElementById("navDeck").classList.remove("active");
  document.getElementById("navQuiz").classList.add("active");
  showSetup();
}

function showSetup(){
  document.getElementById("quizSetup").classList.remove("hidden");
  document.getElementById("quizActive").classList.add("hidden");
  document.getElementById("quizFin").classList.add("hidden");
  // Generate number options based on class size
  const n=cards.length;
  const opts=document.getElementById("setupOptions");
  const choices=[];
  if(n>=5) choices.push(5);
  if(n>=10) choices.push(10);
  if(n>=15) choices.push(15);
  if(n>=20) choices.push(20);
  // Always add some smaller options if class is small
  if(!choices.length){for(let i=2;i<=n;i++) choices.push(i)}
  opts.innerHTML=choices.map(c=>`<button class="setup-opt" onclick="launchQuiz(${c})">${c}<\/button>`).join("");
  document.getElementById("allBtn").textContent=t("all_class")+" ("+n+")";
}

function launchQuiz(count){
  const total=count||cards.length;
  const w=cards.flatMap(c=>Array(Math.max(1,4-c.score)).fill(c));
  const s=shuffle(w),seen=new Set();
  quizCards=s.filter(c=>{if(seen.has(c.id))return false;seen.add(c.id);return true}).slice(0,total);
  quizIdx=0;flipped=false;score={ok:0,total:0};
  document.getElementById("quizSetup").classList.add("hidden");
  showQCard();
}

function showQCard(){
  document.getElementById("quizActive").classList.remove("hidden");
  document.getElementById("quizFin").classList.add("hidden");
  const c=quizCards[quizIdx];
  document.getElementById("qProg").textContent=(quizIdx+1)+" / "+quizCards.length;
  document.getElementById("qScore").textContent="✓ "+score.ok+" / "+score.total;
  document.getElementById("qFill").style.width=((quizIdx/quizCards.length)*100)+"%";
  document.getElementById("qPhoto").src=c.photo;
  document.getElementById("guessUI").classList.remove("hidden");
  document.getElementById("resUI").classList.add("hidden");
  document.getElementById("tapHint").classList.remove("hide");
  flipped=false;
}

function revealName(){
  if(flipped) return;
  flipped=true;
  const c=quizCards[quizIdx];
  document.getElementById("tapHint").classList.add("hide");
  document.getElementById("guessUI").classList.add("hidden");
  document.getElementById("resUI").classList.remove("hidden");
  document.getElementById("ansName").textContent=c.firstName||c.name;
  const sEl=document.getElementById("ansSurname");
  sEl.textContent=c.lastName||"";
  sEl.style.display=c.lastName?"block":"none";
}

async function judgeCard(knew){
  const c=quizCards[quizIdx];
  score.total++;
  if(knew) score.ok++;
  const card=cards.find(x=>x.id===c.id);
  if(card){card.attempts++;card.score=knew?card.score+1:Math.max(0,card.score-1);await dbPut(S_CARDS,card)}
  document.getElementById("qScore").textContent="✓ "+score.ok+" / "+score.total;
  document.getElementById("qFill").style.width=(((quizIdx+1)/quizCards.length)*100)+"%";
  if(quizIdx+1>=quizCards.length){showFin();return}
  quizIdx++;showQCard();
}

function showFin(){
  document.getElementById("quizActive").classList.add("hidden");
  document.getElementById("quizFin").classList.remove("hidden");
  document.getElementById("finN").textContent=score.ok+" / "+score.total;
}

// ================ Export / Import ================
function exportFolder(){
  if(!currentFolder||!cards.length) return;
  const data={folder:{id:currentFolder.id,name:currentFolder.name},cards:cards};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const safeName=currentFolder.name.replace(/[^a-zA-Z0-9àâäéèêëïîôùûüÿçæœ _-]/g,"").replace(/ /g,"_");
  a.href=url;a.download="visages_"+safeName+".json";a.click();
  URL.revokeObjectURL(url);
  showToast(t("export_done"));
}

async function importCards(e){
  const file=e.target.files&&e.target.files[0];
  if(!file||!currentFolder) return;
  try{
    const text=await file.text();
    const data=JSON.parse(text);
    // Support both old format (array) and new format ({folder, cards})
    const arr=Array.isArray(data)?data:(data.cards||[]);
    // An id already used by another class must not be reused: writing it would
    // move that record here instead of copying it, emptying the other class.
    const taken=new Set((await dbAll(S_CARDS)).map(x=>x.id));
    let count=0;
    for(const c of arr){
      if(!c.id||!c.name||!c.photo) continue;
      if(cards.find(x=>x.id===c.id)) continue;
      const id=taken.has(c.id)?Date.now().toString()+Math.random().toString(36).slice(2,6):c.id;
      taken.add(id);
      const card={id,folderId:currentFolder.id,name:c.name,firstName:c.firstName||c.name,lastName:c.lastName||"",
        photo:c.photo,src:c.src||null,crop:c.crop||null,score:c.score||0,attempts:c.attempts||0,order:nextOrder(cards)};
      cards.push(card);await dbPut(S_CARDS,card);count++;
    }
    renderDeck();
    showToast(t("import_done")(count));
  }catch(err){showToast(t("invalid_file"))}
  e.target.value="";
}

async function importFolder(e){
  const file=e.target.files&&e.target.files[0];
  if(!file) return;
  try{
    const text=await file.text();
    const data=JSON.parse(text);
    if(!data.folder||!data.cards) throw new Error("Format invalide");
    // Create folder with new id to avoid conflicts
    const newId=Date.now().toString();
    const folder={id:newId,name:data.folder.name,created:Date.now(),order:nextOrder(folders)};
    folders.push(folder);await dbPut(S_FOLDERS,folder);
    let count=0;
    for(const c of data.cards){
      if(!c.name||!c.photo) continue;
      const card={id:(Date.now()+count).toString(),folderId:newId,name:c.name,firstName:c.firstName||c.name,lastName:c.lastName||"",
        photo:c.photo,src:c.src||null,crop:c.crop||null,score:0,attempts:0,order:count};
      await dbPut(S_CARDS,card);count++;
    }
    renderFolders();
    showToast(t("import_folder_done")(data.folder.name,count));
  }catch(err){showToast(t("invalid_file"))}
  e.target.value="";
}

document.getElementById("navBar").classList.add("hidden");
